name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Usar banco de dados próprio (se configurado)
        # Se os secrets existirem (Settings > Secrets and variables > Actions), eles substituem o .env.
        env:
          SB_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SB_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SB_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SB_URL" ]; then echo "Sem secrets: usando o .env do repositório"; exit 0; fi
          {
            echo "VITE_SUPABASE_URL=$SB_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$SB_KEY"
            echo "VITE_SUPABASE_PROJECT_ID=$SB_ID"
          } > .env.production.local
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
